<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냉부</title>
    <link rel="stylesheet" href="header.css">
</head>
<body>

<!-- ============================
     헤더
     로고 / 검색창 / 네비 / 유저 액션
============================= -->
<header class="site-header">
    <div class="header-inner">

        <!-- 로고 -->
        <a href="/main.html" class="logo">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="2" width="20" height="24" rx="3" stroke="#3D2E1E" stroke-width="2"/>
                <line x1="4" y1="10" x2="24" y2="10" stroke="#3D2E1E" stroke-width="2"/>
                <line x1="9" y1="6" x2="9" y2="8" stroke="#3D2E1E" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="9" y1="14" x2="9" y2="20" stroke="#3D2E1E" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>냉부</span>
        </a>

        <!-- 검색창 -->
        <div class="search-bar">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" placeholder="레시피, 팁 검색...">
        </div>

        <!-- 네비게이션 메뉴 -->
        <nav class="header-nav">
            <a href="/main.html" class="nav-link active">홈</a>
            <a href="/board/recipe-list.html" class="nav-link ">레시피 목록</a>
            <a href="#" class="nav-link">오늘 뭐 먹지?</a>
            <a href="#" class="nav-link">요리 꿀팁</a>
        </nav>

        <!-- 유저 액션 -->
        <div class="header-actions">
            <!-- 로그인 상태: 프로필 원 (마이페이지 이동) -->
            <a href="/mypage" class="user-avatar" id="userAvatar" style="display:none;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.8">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
            </a>
            <!-- 비로그인 상태: 로그인 버튼 -->
            <a href="/login" class="login-link" id="loginBtn">로그인</a>
        </div>

    </div>
</header>

<script>
    // 로그인 상태 확인 후 UI 전환
    // 실제 구현 시 서버에서 세션 정보를 받아 처리
    const isLoggedIn = false; // TODO: 서버 세션 연동 후 교체

    if (isLoggedIn) {
        document.getElementById('userAvatar').style.display = 'flex';
        document.getElementById('loginBtn').style.display = 'none';
    }
</script>

</body>
</html>
