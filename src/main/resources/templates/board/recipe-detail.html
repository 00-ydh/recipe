<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레시피 상세 페이지</title>
    <link rel="stylesheet" href="/board/css/recipe-detail.css">
    <link rel="stylesheet" href="../header/header.css">
</head>
<body>

<!--header 공통 파일 header 들어가는 부분에 이 두줄 코드 넣을 것!-->
<div th:replace="~{header/header :: header}"></div>
<!--<script src="/header/load-header.js"></script>-->
<!--header 끝-->

<main class="recipe-detail">
    <div class="container">

        <!-- 히어로 이미지 -->
        <div class="recipe-hero">
            <img th:scr="${post.mainImage}" alt="레시피 대표 이미지">
            <!--    레시피 카테고리(한식,중식,일식,양식 등)     -->
            <span class="recipe-tag" th:text="${post.categoryName}">한식</span>
        </div>

        <!-- 제목 + 액션 -->
        <div class="recipe-title-row">
            <h1 class="recipe-title" th:text="${post.title}">매콤달콤 전통 비빔밥과 특제 고추장 소스</h1>
            <div class="recipe-actions">
                <!--  북마크 버튼-->
                <button class="action-btn" title="북마크">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                </button>
                <!--  좋아요 버튼 -->
                <button class="action-btn"  title="좋아요">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                </button>

            </div>
        </div>

        <!-- 레시피 메타 정보 -->
        <div class="recipe-meta">
            <!-- 작성자-->
            <span class="meta-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                <span th:text="${post.memberName}"></span>
            </span>
        </div>

        <hr class="divider">
        <!-- 요리 순서 -->
        <div class="ingredients-section">
            <h2 class="section-label">요리 순서</h2>
            <!--   사진과 글 있을 예정-->
            <div class="content" th:utext="${post.content}">
                <p>1. 재료를 손질하여 준비합니다.</p>
                <p>2. 팬에 기름을 두르고 볶아줍니다.</p>
                <p>3. 양념을 넣고 잘 섞어줍니다.</p>
            </div>
        </div>
<!--        로그인 여부에 따라 수정 삭제 만든다면-->
<!--        <div th:if="${loginMember.id == post.memberId}">-->
<!--            <a th:href="@{/recipe/edit/{id}(id=${post.id})}">수정</a>-->
<!--            <a th:href="@{/recipe/delete/{id}(id=${post.id})}">삭제</a>-->
<!--        </div>-->

        <!-- 조회수 / 좋아요 - 테이블에 넣어야함 -->
        <div class="recipe-stats">
            <div class="stat-item">
                <span class="stat-label" th:text="${post.viewCount}">조회수</span>
                <span class="stat-value">1,240</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">좋아요</span>
                <span class="stat-value">45,892</span>
            </div>
        </div>

        <hr class="divider">
        <!--------  댓글 섹션 시작입니다!! 댓글 여기서 부터 봐주세요 -------->
        <!-- 섹션 1: 댓글 -->
        <div class="detail-card">
            <h2 class="section-label">댓글</h2>

            <!-- 댓글 작성하는 부분 -->
            <form action="/reply/write" method="post" class="comment-write">
                <!-- 어떤 게시글인지 알려주기 위한 postId (recipe.id 값을 넣어줌) -->
                <input type="hidden" name="postId" th:value="${post.id}" />

                <!-- 어떤 게시판인지 알려주기 위한 boardType (레시피 게시판이므로 recipe) -->
                <input type="hidden" name="boardType" value="recipe" />

                <!-- 프로필 사진부분 (사진x) - 그냥 원으로 대체! -->
                <div class="comment-avatar default-av"></div>
                <div class="comment-write-body">
                    <!-- 댓글 입력하는 부분 -->
                    <textarea name="content" class="comment-input" placeholder="나만의 소감을 남겨주세요..." required></textarea>

                    <div class="comment-submit-row comment-submit-inline">
                        <!-- 댓글 등록 버튼 -->
                        <button type="submit" class="btn-submit">등록</button>
                    </div>
                </div>
            </form>

            <!-- 달린 댓글 확인하는 부분 (타임리프 반복문 적용) -->
            <div class="comment-list">
                <!-- replies 리스트를 돌면서 댓글 하나씩 출력 -->
                <div class="comment-item" th:each="reply : ${replies}">

                    <div class="comment-avatar av-orange" th:text="${#strings.substring(reply.name,0,1)}">김</div>
                    <div class="comment-body">
                        <!-- 작성자, 작성한 날짜 표시 -->
                        <p class="comment-author">

                            <span th:text="${reply.name}">작성자</span>
                            <span class="comment-time" th:text="${#temporals.format(reply.createdAt, 'yyyy.MM.dd HH:mm')}">2026.07.29</span>
                        </p>
                        <!-- 댓글 내용 표시 -->
                        <p class="comment-text" th:text="${reply.content}">댓글 내용이 여기에 표시됩니다.</p>

                        <!-- 댓글 삭제 버튼  -->
                        <form action="/reply/delete" method="post" style="display:inline; float:right;">
                            <!--                            //삭제할 대상의 고유 번호를 서버로 전달한다.-->
                            <input type="hidden" name="id" th:value="${reply.id}" />
                            <!--                            어떤 게시글에 달린 댓글인지 서버로 전달한다-->
                            <input type="hidden" name="postId" th:value="${post.id}" />

                            <input type="hidden" name="boardType" value="recipe" />
                            <button type="submit" style="border:none; background:none; color:#ff6b6b; cursor:pointer; font-size:12px;">삭제</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
