<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>레시피 작성하기</title>
    <link rel="stylesheet" href="/board/css/recipe-write.css">
    <!-- Editor's Style CDN-->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
</head>
<body>
<div class="container">
    <h2>레시피 작성하기</h2>
    <p class="sub-title">
        당신만이 알고 있는 주방의 마법, 나만의 요리 비법을 공유해 주세요.
    </p>
    <div class="write-box">
<!--       enctype="multipart/form-data" 대표 이미지 업로드를 위해 필요-->
        <form method="POST" th:action="@{/recipe/write}" th:object="${recipePostForm}" enctype="multipart/form-data">
            <div class="form-group">
                <label>사진 첨부 (선택)</label>
                <label class="upload-box">
                    <input type="file" hidden>
                    <div class="camera">사진 첨부</div>
                    <p>클릭하거나 파일을 드래그하여 이미지를 추가하세요</p>
                </label>
            </div>
            <div class="form-group">
                <label>제목</label>
                <input type="text" th:field="*{title}" placeholder="꿀팁의 핵심 내용을 한 줄로 요약해 주세요">
            </div>
            <div class="form-group">
                <label>카테고리</label>
                <label>
                    <select name="categoryId" th:field="*{categoryId}" class="category-select">
                        <option value="0">카테고리를 선택하세요</option>
                        <option value="1">한식</option>
                        <option value="2">중식</option>
                        <option value="3">양식</option>
                        <option value="4">일식</option>
                    </select>
                </label>
            </div>
            <div class="form-group">
                <label for="content">내용</label>
                <input type="hidden" id="content" th:field="*{content}">
                <div class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">에러 메세지</div>
            </div>
            <div id="editor"></div>
            <div class="button-group">
                <a th:href="@{/recipe/list}" class="cancel-btn">취소하기</a>
                <button type="submit" class="submit-btn">레시피 등록하기</button>
            </div>
        </form>
    </div>
</div>
<!--    toastui CDN(js)-->
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<script>
    <!--       에디터 생성-->
    const editor = new toastui.Editor({
        // 에디터가 표시될 위치
        el: document.querySelector('#editor'),
        height: '500px',
        initialEditType: 'wysiwyg',  // wysiwyg/markdown 타입도 있음 html로 저장시키기위해 wysiwyg 방식으로 사용
        // initialValue: document.querySelector("#content").value,
        // markdown모드에서만 쓸모 있는 기능
        // previewStyle: 'vertical',
        hideModeSwitch : true,  // wysiwyg/markdown 전환 버튼 숨기기

        // Toast UI 함수
        // hooks: 특정 이벤트가 발생하면 실행되는 함수
        hooks: {
            // 이미지 업로드 및 드래그앱 드롭하면 이 함수가 자동으로 호출
            async addImageBlobHook(blob, callback) {
                try {
                    /*
                     * 1. 에디터에 업로드한 이미지를 FormData 객체에 저장
                     *    (이때, 컨트롤러 uploadEditorImage 메서드의 파라미터인 'image'와 formData에 append 하는 key('image')값은 동일해야 함)
                     */
                    const formData = new FormData();
                    formData.append('image', blob);

                    // 2. FileApiController - uploadEditorImage 메서드 호출
                    // ('/homework/board/image-upload')로 업로드
                    const response = await fetch('/recipe/image-upload', {
                        method: 'POST',
                        body: formData,
                    });

                    // 3. 컨트롤러에서 전달받은 디스크에 저장된 파일명
                    const filename = await response.text();
                    console.log('서버에 저장된 파일명 : ', filename);

                    // 4. addImageBlobHook의 callback 함수를 통해, 디스크에 저장된 이미지를 에디터에 렌더링
                    const imageUrl = `/recipe/image-print?filename=${filename}`;
                    // 5. Toast UI에게 이 이미지를 본문에 삽입하라는 함수
                    callback(imageUrl, 'image alt attribute');

                } catch (error) {
                    console.error('업로드 실패 : ', error);
                }
            }
        }
    });
    // 수정 화면이면 기존 내용 표시
    const content = document.querySelector("#content").value;
    if(content) {
        editor.setHTML(content);
    }
    // form 태그를 찾음
    const form = document.querySelector('form');
    // form 태그에 submit이벤트 등록 또는 수정버튼
    form.addEventListener('submit', function (){
        // HTML에 저장
        document.querySelector("#content").value = editor.getHTML();
    })
</script>

</body>
</html>
