<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>레시피 작성하기</title>
    <link rel="stylesheet" href="/board/css/recipe-write.css">
    <!-- Editor's Style CDN-->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
</head>
<body>
<div class="container">
    <h2>레시피 작성하기</h2>
    <p class="sub-title">
        당신만이 알고 있는 주방의 마법, 나만의 요리 비법을 공유해 주세요.
    </p>
    <div class="write-box">
        <form>
            <div class="form-group">
                <label>사진 첨부 (선택)</label>
                <label class="upload-box">
                    <input type="file" hidden>
                    <div class="camera">사진 첨부</div>
                    <p>클릭하거나 파일을 드래그하여 이미지를 추가하세요</p>
                </label>
            </div>
            <div class="form-group">
                <label>제목</label>
                <input type="text" placeholder="꿀팁의 핵심 내용을 한 줄로 요약해 주세요">
            </div>
            <div class="form-group">
                <label>카테고리</label>
                <label>
                    <select name="categoryId" class="category-select">
                        <option value="">카테고리를 선택하세요</option>
                        <option value="1">한식</option>
                        <option value="2">중식</option>
                        <option value="3">양식</option>
                        <option value="4">일식</option>
                    </select>
                </label>
            </div>
            <div class="form-group">
                <label>내용</label>
                <label>
                    <textarea placeholder="이 요리를 사용하면 어떤 점이 좋은지, 자세한 방법을 설명해 주세요."></textarea>
                </label>
            </div>
            <div class="button-group">
                <a th:href="@{/recipe/list}" class="cancel-btn">취소하기</a>
                <button type="submit" class="submit-btn">레시피 등록하기</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
