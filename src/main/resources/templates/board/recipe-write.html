<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>레시피 작성하기</title>
    <link rel="stylesheet" href="/board/css/recipe-write.css">
    <!-- Editor's Style CDN-->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
</head>
<body>
<!--header 삽입 코드 한줄 !-->
<div th:replace="~{header/header :: header}"></div>

<div class="container">
    <h2 th:text="${recipePostForm.id == 0 ? '레시피 등록하기' : '레시피 수정하기'}">레시피 등록하기</h2>
    <p class="sub-title">
        당신만이 알고 있는 주방의 마법, 나만의 요리 비법을 공유해 주세요.
    </p>
    <div class="write-box">
<!--       enctype="multipart/form-data" 대표 이미지 업로드를 위해 필요-->
        <form class="write-box" method="POST" th:action="@{{action}(action=${recipePostForm.id == 0} ? 'write' : 'edit')}" enctype="multipart/form-data" th:object="${recipePostForm}" >
            <input type="hidden" th:field="*{id}">
            <div class="form-group">
                <label for="file"> 사진 첨부 (선택)</label>
                <label class="upload-box">
<!--                    accept="image/*" 모든 이미지 형식 허용 여기 부분 문제인거 같은데-->
                    <input type="file" id="file" th:field="*{file}">
                    <div th:if="${recipePostForm.originalFilename != null}" class="camera">사진 첨부</div>
                    <p>클릭하거나 파일을 드래그하여 이미지를 추가하세요</p>
                </label>
            </div>
            <div class="form-group">
                <label>제목</label>
                <input type="text" th:field="*{title}" placeholder="꿀팁의 핵심 내용을 한 줄로 요약해 주세요">
                <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>
<!--            레시피 작성일때만 카테고리 박스 뜨게 -->
            <div class="form-group" th:if="${recipePostForm.id == 0}">
                <label>카테고리</label>
                <label>
                    <select name="categoryId" th:field="*{categoryId}" class="category-select">
                        <option value="0">카테고리를 선택하세요</option>
                        <option value="1">한식</option>
                        <option value="2">양식</option>
                        <option value="3">중식</option>
                        <option value="4">일식</option>
                    </select>
                    <div class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}">에러 메세지</div>
                </label>
            </div>
            <div class="form-group">
                <label for="content">내용</label>
                <input type="hidden" id="content" th:field="*{content}">
                <div class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">에러 메세지</div>
            </div>
<!--            등록인지 수정인지에 따라 버튼 이 바뀜-->
            <div id="editor"></div>
            <div class="button-group">
                <a th:href="@{/recipe/list}" class="cancel-btn">취소</a>
                <button type="submit" th:text="${recipePostForm.id == 0 ? '레시피 등록' : '레시피 수정'}" class="submit-btn">레시피 등록하기</button>
            </div>
        </form>
    </div>
</div>
<!--    toastui CDN(js)-->
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<script>
    <!--       에디터 생성-->
    const editor = new toastui.Editor({
        // 에디터가 표시될 위치
        el: document.querySelector('#editor'),
        height: '500px',
        initialEditType: 'wysiwyg',  // wysiwyg/markdown 타입도 있음 html로 저장시키기위해 wysiwyg 방식으로 사용
        // markdown모드에서만 쓸모 있는 기능
        // previewStyle: 'vertical',
        hideModeSwitch: true,  // wysiwyg/markdown 전환 버튼 숨기기
       // initialValue: '몇인분/ 조리시간 / ',
        initialValue:`레시피 작성 가이드
- 재료의 종류와 분량을 정확히 표기해주세요.
- 몇인분인지 적어주세요.
- 요리 시간이 얼마나 걸리는지 적어주세요
- 단계별 설명에 적합한 선명한 과정사진을 넣어주세요.
- 나만의 요리팁과 요리시 주의사항을 남겨주세요.

예시)
재료
- 돼지고기 300g
- 양파 1개
- 고추장 2큰술

몇인분
-1인분

조리시간
-30분

조리 순서
1. 양파를 채 썰어 준비합니다.
2. 돼지고기를 볶습니다.
3. 양념을 넣고 함께 볶아 완성합니다.`,
        // Toast UI 함수
        // hooks: 특정 이벤트가 발생하면 실행되는 함수
        hooks: {
            // 이미지 업로드 및 드래그앱 드롭하면 이 함수가 자동으로 호출
            async addImageBlobHook(blob, callback) {
                try {
                    /*
                     * 1. 에디터에 업로드한 이미지를 FormData 객체에 저장
                     *    (이때, 컨트롤러 uploadEditorImage 메서드의 파라미터인 'image'와 formData에 append 하는 key('image')값은 동일해야 함)
                     */
                    const formData = new FormData();
                    formData.append('image', blob);

                    // 2. FileApiController - uploadEditorImage 메서드 호출
                    // ('/homework/board/image-upload')로 업로드
                    const response = await fetch('/recipe/image-upload', {
                        method: 'POST',
                        body: formData,
                    });

                    // 3. 컨트롤러에서 전달받은 디스크에 저장된 파일명
                    const filename = await response.text();
                    console.log('서버에 저장된 파일명 : ', filename);

                    // 4. addImageBlobHook의 callback 함수를 통해, 디스크에 저장된 이미지를 에디터에 렌더링
                    const imageUrl = `/recipe/image-print?filename=${filename}`;
                    // 5. Toast UI에게 이 이미지를 본문에 삽입하라는 함수
                    callback(imageUrl, 'image alt attribute');

                } catch (error) {
                    console.error('업로드 실패 : ', error);
                }
            }
        }
    });
    // 수정 화면이면 기존 내용 표시
    const content = document.querySelector("#content").value;
    if(content) {
        editor.setHTML(content);
    }
    // [수정] document.querySelector('form') → 'form.write-box'
    // 이유: 헤더에 검색 form이 존재해서 querySelector('form')이
    //       작성 form이 아닌 헤더 검색 form을 잡는 문제가 있었음
    const form = document.querySelector('form.write-box');
    // form 태그에 submit이벤트 등록 또는 수정버튼
    form.addEventListener('submit', function (){
        // HTML에 저장
        document.querySelector("#content").value = editor.getHTML();
    })
</script>

</body>
</html>
