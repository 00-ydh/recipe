<!--요리 꿀팁(게시판) 작성하기 페이지 -->
<!-- 작성 / 수정 / 삭제 페이지 공용으로 사용
     - postForm.id == 0 : 새 글 작성 페이지
     - postForm.id != 0 : 기존 글 수정 | 삭제 페이지
-->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>요리 꿀팁 작성하기</title>
    <link rel="stylesheet" href="/board/css/tip-write.css">
    <!-- Toast UI Editor CSS -->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
</head>
<body>

<!--header 삽입 코드 한줄 !-->
<div th:replace="~{header/header :: header}"></div>

<!--전체 틀(박스)-->
<div class="container">

<!-- 꿀팁 작성하기 제목 부분   -->
    <div class="header">
        <h2 th:text="${postForm.id == 0} ? '요리 꿀팁 작성하기' : '요리 꿀팁 수정 | 삭제하기'">요리 꿀팁 작성하기</h2>
        <p class="sub-title" th:text="${postForm.id == 0} ? '당신만이 알고 있는 주방의 마법, 나만의 요리 꿀팁을 공유해 주세요.' : '작성한 꿀팁을 수정하거나 삭제할 수 있습니다.'">
            당신만이 알고 있는 주방의 마법, 나만의 요리 꿀팁을 공유해 주세요.
        </p>
    </div>

    <form class="write-box" th:action="@{${postForm.id == 0} ? '/tip/write' : '/tip/edit'}" method="POST" th:object="${postForm}">


        <!-- 수정 시 id 전달을 위한 hidden input -->
        <input type="hidden" th:field="*{id}">
        <!-- 꿀팁은 카테고리 없음 - @Positive 검증 통과를 위해 기본값 설정 -->
        <input type="hidden" name="categoryId" value="1">

        <div class="form-group">
            <label>제목</label>
            <input type="text" th:field="*{title}" placeholder="요리 꿀팁의 제목을 간단하게 입력해 주세요">
            <span class="error-msg" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        </div>

        <div class="form-group">
            <label>내용</label>
            <input type="hidden" id="content" th:field="*{content}">
            <span class="error-msg" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></span>
        </div>
        <!-- Toast UI Editor 렌더링 위치 -->
        <div id="editor"></div>

        <!--  제출 버튼 부분-->
        <div class="button-box">
            <!-- 새 글이면 취소하기, 수정이면 삭제하기 -->
            <button th:if="${postForm.id == 0}" type="button" class="cancel-btn" onclick="history.back()">취소하기</button>
            <button th:if="${postForm.id != 0}" type="button" class="cancel-btn"
                    onclick="if(confirm('정말 게시글을 삭제하시겠습니까?')) document.getElementById('deleteForm').submit()">삭제하기</button>
            <!-- 등록/수정 버튼: 새 글이면 '꿀팁 등록하기', 수정이면 '꿀팁 수정하기' -->
            <button type="submit" class="submit-btn" th:text="${postForm.id == 0} ? '꿀팁 등록하기' : '꿀팁 수정하기'">꿀팁 등록하기</button>
        </div>

    </form>
</div>

<!-- 삭제용 hidden form -->
<form id="deleteForm" th:action="@{/tip/delete}" method="POST" style="display:none;">
    <input type="hidden" name="id" th:value="${postForm.id}">
</form>


<!-- Toast UI Editor JS -->
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<script>
    <!--       에디터 생성-->
    const editor = new toastui.Editor({
        // 에디터가 표시될 위치
        el: document.querySelector('#editor'),
        height: '500px',
        initialEditType: 'wysiwyg',  // wysiwyg/markdown 타입도 있음 html로 저장시키기위해 wysiwyg 방식으로 사용
        // initialValue: document.querySelector("#content").value,
        // markdown모드에서만 쓸모 있는 기능
        // previewStyle: 'vertical',
        hideModeSwitch : true,  // wysiwyg/markdown 전환 버튼 숨기기
        placeholder: '요리 꿀팁 내용을 입력해 주세요.',

        // Toast UI 함수
        // hooks: 특정 이벤트가 발생하면 실행되는 함수
        hooks: {
            // 이미지 업로드 및 드래그앱 드롭하면 이 함수가 자동으로 호출
            async addImageBlobHook(blob, callback) {
                try {
                    /*
                     * 1. 에디터에 업로드한 이미지를 FormData 객체에 저장
                     *    (이때, 컨트롤러 uploadEditorImage 메서드의 파라미터인 'image'와 formData에 append 하는 key('image')값은 동일해야 함)
                     */
                    const formData = new FormData();
                    formData.append('image', blob);

                    // 2. FileApiController - uploadEditorImage 메서드 호출
                    // ('/homework/board/image-upload')로 업로드
                    const response = await fetch('/tip/image-upload', {
                        method: 'POST',
                        body: formData,
                    });

                    // 3. 컨트롤러에서 전달받은 디스크에 저장된 파일명
                    const filename = await response.text();
                    console.log('서버에 저장된 파일명 : ', filename);

                    // 4. addImageBlobHook의 callback 함수를 통해, 디스크에 저장된 이미지를 에디터에 렌더링
                    const imageUrl = `/tip/image-print?filename=${filename}`;
                    // 5. Toast UI에게 이 이미지를 본문에 삽입하라는 함수
                    callback(imageUrl, 'image alt attribute');

                } catch (error) {
                    console.error('업로드 실패 : ', error);
                }
            }
        }
    });

    // 수정 화면이면 기존 내용 표시
    const content = document.querySelector("#content").value;
    if(content) {
        editor.setHTML(content);
    }
    // [수정] document.querySelector('form') → 'form.write-box'
    // 이유: 헤더에 검색 form이 존재해서 querySelector('form')이
    //       작성 form이 아닌 헤더 검색 form을 잡는 문제가 있었음
    const form = document.querySelector('form.write-box');
    // form 태그에 submit이벤트 등록 또는 수정버튼
    form.addEventListener('submit', function () {
        document.querySelector("#content").value = editor.getHTML();
    })
</script>

</body>
</html>
