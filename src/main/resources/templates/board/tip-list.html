<!--요리 꿀팁(게시판) 목록 페이지 -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>요리 꿀팁 목록</title>
    <link rel="stylesheet" href="/board/css/tip-list.css">
</head>
<body>

<!--header 삽입 코드 한줄 !-->
<div th:replace="~{header/header :: header}"></div>

<!--전체 틀(박스)-->
<div class="container">

    <!-- 요리 꿀팁 게시판 제목 부분 -->
    <div class="header">
        <div>
            <h2>요리 꿀팁!</h2>
            <p>당신만의 소중한 요리 꿀팁을 공유해보세요!</p>
        </div>

        <!-- 꿀팁 작성하기 페이지로 이동 -->
        <button class="write-btn" onclick="location.href='/tip/write'">
            요리 꿀팁 작성하기
        </button>
    </div>

<div class="tip-list">

        <!-- 꿀팁 게시글 목록 반복 출력 -->
        <div class="tip-card" th:each="post : ${posts}" th:onclick="|location.href='@{/tip/detail(id=${post.id})}'|" style="cursor:pointer;">

            <div class="tip-info">
                <h3 th:text="${post.title}">요리 꿀팁 게시글 제목</h3>

                <!-- 작성자, 작성일, 조회수 -->
                <div class="meta">
                    <span>
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                        <span th:text="${post.memberName}">작성자</span>
                    </span>
                    <span>
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        <span th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd')}">2024.05.20</span>
                    </span>
                    <span>
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <span th:text="${post.viewCount}">0</span>
                    </span>
                </div>
            </div>

            <!-- 화살표 꾸밈요소 -->
            <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"/>
            </svg>
        </div>

    </div>

<!--    페이지 네이션-->
    <div class="pagination" id="pagination"></div>

</div>


<!--페이지네이션 js 코드 (필요없을 시 삭제 예정)-->
<script>
    const PAGE_SIZE = 10;
    const cards = Array.from(document.querySelectorAll('.tip-card'));
    let currentPage = 1;

    function showPage(page) {
        currentPage = page;
        const start = (page - 1) * PAGE_SIZE;
        const end = start + PAGE_SIZE;

        cards.forEach((card, index) => {
            card.style.display = (index >= start && index < end) ? '' : 'none';
        });

        renderPagination();
    }

    function renderPagination() {
        const totalPages = Math.ceil(cards.length / PAGE_SIZE);
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';

        // 이전 버튼
        const prev = document.createElement('button');
        prev.textContent = '〈';
        prev.disabled = currentPage === 1;
        prev.onclick = () => showPage(currentPage - 1);
        pagination.appendChild(prev);

        // 페이지 번호 버튼
        for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement('button');
            btn.textContent = i;
            if (i === currentPage) btn.classList.add('active');
            btn.onclick = () => showPage(i);
            pagination.appendChild(btn);
        }

        // 다음 버튼
        const next = document.createElement('button');
        next.textContent = '〉';
        next.disabled = currentPage === totalPages;
        next.onclick = () => showPage(currentPage + 1);
        pagination.appendChild(next);
    }

    // 초기 실행
    showPage(1);
</script>

</body>
</html>
