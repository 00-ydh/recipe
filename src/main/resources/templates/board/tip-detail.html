<!--요리 꿀팁(게시판) 상세 페이지 -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요리 꿀팁 상세</title>
    <link rel="stylesheet" href="/board/css/tip-detail.css">
</head>
<body>

<!--header 삽입 코드 한줄 !-->
<div th:replace="~{header/header :: header}"></div>


<main class="recipe-detail">
    <div class="container tip-container">

        <!-- 섹션 1: 게시글 -->
        <div class="detail-card">

            <!-- 제목 + 좋아요 -->
            <div class="recipe-title-row">
                <h1 class="recipe-title" th:text="${tip.title}">꿀팁 제목</h1>

                    <div class="recipe-actions">
                        <!--북마크 버튼 모양 변경 완료 -->

                        <form action="/good/toggle" method="post" style="display:inline;">
                            <input type="hidden" name="postId" th:value="${tip.id}">
                            <input type="hidden" name="likeType" value="3">
                            <input type="hidden" name="postType" value="tip">
                            <button type="submit" class="action-btn" title="북마크">
                                <svg width="20" height="20" viewBox="0 0 24 24"
                                     th:attr="fill=${isScrapped != null && isScrapped ? '#ff6b6b' : 'none'}"
                                     stroke="currentColor" stroke-width="1.8">
                                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                                </svg>
                            </button>
                        </form>
                    </div>

                <!-- 좋아요 버튼!!!  -->
                <div class="recipe-actions">
<!--                    좋아요 버튼 클릭시 /good/toggle 주소로 post요청을 보내는폼-->
                    <form action="/good/toggle" method="post" style="display:inline;">
                        <input type="hidden" name="postId" th:value="${tip.id}">
                        <input type="hidden" name="likeType" value="2">
                        <input type="hidden" name="postType" value="tip">
                        <button type="submit" class="action-btn" title="좋아요">
                            <svg width="20" height="20" viewBox="0 0 24 24"
                                 th:attr="fill=${isLiked != null && isLiked ? '#ff6b6b' : 'none'}"
                                 stroke="currentColor" stroke-width="1.8">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                            </svg>
                        </button>
                    </form>
                </div>
            </div>

            <!-- 메타 정보: 작성자, 작성일, 조회수 -->
            <div class="recipe-meta">
                <span class="meta-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                <!-- 작성자  -  링크연결 (프로필 페이지로)-->
                    <a th:href="@{/member/profile/{targetName}(targetName=${tip.memberName})}" th:text="${tip.memberName}" style="color:inherit; text-decoration:none;">작성자</a>
                </span>
                <span class="meta-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span th:text="${#temporals.format(tip.createdAt, 'yyyy.MM.dd HH:mm')}">2024.05.20</span>
                </span>
                <span class="meta-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <span th:text="${tip.viewCount}">0</span>
                </span>
            </div>

            <!-- 제목과 내용 구분선 -->
            <hr class="divider">

            <!-- 꿀팁 내용 -->
            <div class="ingredients-section">
                <h2 class="section-label">내용</h2>
                <div class="step-box">
                    <p th:utext="${tip.content}">꿀팁 내용이 여기에 표시됩니다.</p>
                </div>
            </div>

            <!-- 스크랩 / 좋아요 + 목록 보기 버튼 -->
            <hr class="divider">
            <div class="stats-and-btn">
                <div class="recipe-stats">
                    <div class="stat-item">
                        <span class="stat-label">조회수</span>
                        <span class="stat-value" th:text="${tip.viewCount}">0</span>
                    </div>

                    <div class="stat-item">
                        <span class="stat-label">좋아요</span>
                        <!-- 좋아요 수 보여주는 곳 -->
                        <span class="stat-value" th:text="${tip.likeCount}">0</span>
                    </div>
                </div>
                <a href="/tip/list" class="list-btn">목록 보기</a>
            </div>

        </div>


        <!--------  댓글 섹션 시작입니다!! 댓글 여기서 부터 봐주세요 -------->
        <!-- 섹션 2: 댓글 -->
        <div class="detail-card">
            <h2 class="section-label">댓글</h2>

            <!-- 댓글 작성하는 부분 -->
            <form action="/reply/write" method="post" class="comment-write">
                <!-- 어떤 게시글인지 알려주기 위한 postId (tip.id 값을 넣어줌) -->
                <input type="hidden" name="postId" th:value="${tip.id}" />

                <!-- 어떤 게시판인지 알려주기 위한 boardType (팁 게시판이므로 tip) -->
                <input type="hidden" name="boardType" value="tip" />

                <!-- 프로필 사진부분 (사진x) - 그냥 원으로 대체! -->
                <div class="comment-avatar default-av"></div>
                <div class="comment-write-body">
                    <!-- 댓글 입력하는 부분 -->
                    <textarea name="content" class="comment-input" placeholder="나만의 소감을 남겨주세요..." required></textarea>

                    <div class="comment-submit-row comment-submit-inline">
                        <!-- 댓글 등록 버튼 -->
                        <button type="submit" class="btn-submit">등록</button>
                    </div>
                </div>
            </form>

            <!-- 달린 댓글 확인하는 부분 (타임리프 반복문 적용) -->
            <div class="comment-list">
                <!-- replies 리스트를 돌면서 댓글 하나씩 출력 -->
                <div class="comment-item" th:each="reply : ${replies}">

                    <div class="comment-avatar av-orange" th:text="${#strings.substring(reply.name,0,1)}">김</div>
                    <div class="comment-body">
                        <!-- 작성자, 작성한 날짜 표시 -->
                        <p class="comment-author">
                            <span th:text="${reply.name}">작성자</span>
                            <span class="comment-time" th:text="${#temporals.format(reply.createdAt, 'yyyy.MM.dd HH:mm')}">2026.07.29</span>
                        </p>
                        <!-- 댓글 내용 표시 -->
                        <p class="comment-text" th:text="${reply.content}">댓글 내용이 여기에 표시됩니다.</p>

                        <!-- 댓글 삭제 버튼 (본인이 작성한 댓글일 때만 노출) -->
                        <form action="/reply/delete" method="post" style="display:inline; float:right;"
                              th:if="${session.loginMember != null and reply.memberId == session.loginMember.id}">
                            <!-- 삭제할 대상의 고유 번호를 서버로 전달한다. -->
                            <input type="hidden" name="id" th:value="${reply.id}" />
                            <!-- 어떤 게시글에 달린 댓글인지 서버로 전달한다 -->
                            <input type="hidden" name="postId" th:value="${tip.id}" />
                            <!-- 어떤 게시판인지 알려주기 위한 boardType -->
                            <input type="hidden" name="boardType" value="tip" />

                            <button type="submit" style="border:none; background:none; color:#ff6b6b; cursor:pointer; font-size:12px;">삭제</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
