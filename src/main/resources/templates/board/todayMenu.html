<!---->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>오늘 뭐 먹지?</title>
    <link rel="stylesheet" href="/board/css/todayMenu.css">
</head>
<!--header 공통 파일 header 들어가는 부분에 이 두줄 코드 넣을 것!-->
<!-- templates/header/header.html을 찾고 그 파일 안에서 fragment header를 가져오기 -->
<div th:replace="~{header/header :: header}"></div>
<script src="/header/load-header.js"></script>
<!--header 끝-->
<body>
<div class="container">
    <h2>오늘 뭐 먹지 ??</h2>
    <p class="sub-title">메뉴 결정이 어려우신가요? 카테고리를 선택하면 오늘 먹을만한 요리를 추천해 드립니다!</p>
    <div class="content">
        <!-- 왼쪽 -->
        <div class="category-box">
            <h3>❌ 대표 카테고리 1개를 선택하세요!</h3>
            <button class="category">
                <span class="icon">🍴</span>한식 (Korean)
            </button>
            <button class="category">
                <span class="icon">🥟</span>중식 (Chinese)
            </button>
            <button class="category">
                <span class="icon">🥗</span>양식 (Western)
            </button>
            <button class="category">
                <span class="icon">🍜</span>일식 (Japanese)
            </button>
            <p class="notice">(해당 카테고리 중 무작위로 하나 추천)
            </p>
        </div>
        <!-- 오른쪽 -->
        <div class="result-box">
            <div class="question">?</div>
            <h3>어떤 메뉴를 먹을지 정하지 못하셨나요?</h3>
            <p>
                왼쪽에서 먹고 싶은 장르를 선택해 보세요.<br>
                최고의 외식메뉴를 골라 드릴게요!
            </p>
        </div>
    </div>
</div>
</body>
</html>
