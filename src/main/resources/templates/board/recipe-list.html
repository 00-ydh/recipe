<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>레시피 목록</title>
    <link rel="stylesheet" href="/board/css/recipe-list.css">
</head>
<!--header 공통 파일 header 들어가는 부분에 이 두줄 코드 넣을 것!-->
<!-- templates/header/header.html을 찾고 그 파일 안에서 fragment header를 가져오기 -->
<div th:replace="~{header/header :: header}"></div>
<!--header 끝-->
<body>
<div class="container">
    <div class="page-header">
        <h2>레시피 목록</h2>
        <a th:href="@{/recipe/write}" class="write-btn">
            + 레시피 등록
        </a>
    </div>
<!--    (중요)페이지 넘어가도 조회순 최신순 카테고리 유지할려면 다 넘겨줘야한다-->
    <div class="category">
        <a th:href="@{/recipe/list}" class="active">전체</a>
        <a th:href="@{/recipe/list(categoryId=1, type=${type})}">한식</a>
        <a th:href="@{/recipe/list(categoryId=2, type=${type})}">양식</a>
        <a th:href="@{/recipe/list(categoryId=3, type=${type})}">중식</a>
        <a th:href="@{/recipe/list(categoryId=4, type=${type})}">일식</a>
    </div>
    <div class="top-info">
        <p>총 <span th:text="${postCount}">1,248개</span>의 맛있는 레시피</p>

        <div class="sort" >
            <a th:href="@{/recipe/list(page=1, type='latest', categoryId=${categoryId})}">최신순</a>
            <a th:href="@{/recipe/list(page=1, type='view', categoryId=${categoryId})}">조회순</a>
        </div>
    </div>
    <div class="recipe-list">
        <!-- 이 부분이 반복 됨 여길 each로 돌리면 된다.-->
        <a th:href="@{/recipe/detail(id=${post.id})}" class="recipe-card" th:each="post : ${recipePosts}">
            <div class="recipe-card">
                <div class="image">
                    <img th:if = "${post.mainImage == null}" src="https://loremflickr.com/300/200/food?lock=21" alt="기본 이미지">
                    <img th:if = "${post.mainImage != null}" th:src="@{/images/{filename}(filename=${post.mainImage})}" alt="레시피 이미지">
                </div>
                <div class="content">
                    <span class="tag" th:text="${post.categoryName}">한식</span>
                    <h3 th:text="${post.title}">정통 전주 비빔밥의 비밀 레시피</h3>
                    <div class="writer">
                        <span th:text="${post.memberName}">김셰프</span>
                        <span>👁<span th:text="${post.viewCount}">1.2K</span></span>
                    </div>
                    <div class="created">
                        <span th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')}">2026-07-13 15:30:00</span>
                    </div>
                </div>
            </div>
        </a>
    </div>
<!--    페이지 누를때도 다 넘겨주기(중요)-->
    <div class="pagination">
        <a th:each="i : ${#numbers.sequence(1, totalPage)}"
           th:href="@{/recipe/list(page=${i},categoryId=${categoryId},type=${type})}"
           th:text="${i}">
        </a>
    </div>
</div>
</body>
</html>
