<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>레시피 목록</title>
    <link rel="stylesheet" href="/board/css/recipe-list.css">
</head>
<body>

<div class="container">

    <h2>레시피 목록</h2>

    <div class="category">
        <button class="active">전체</button>
        <button>한식</button>
        <button>중식</button>
        <button>양식</button>
        <button>일식</button>
    </div>

    <div class="top-info">
        <p>총 <span>1,248개</span>의 맛있는 레시피</p>

        <div class="sort">
            <button>최신순</button>
            <button>조회순</button>
        </div>
    </div>

    <div class="recipe-list">

        <div class="recipe-card">

            <div class="image">
                <img src="https://picsum.photos/300/200?1">
                <span class="score">★ 4.8</span>
            </div>

            <div class="content">

                <span class="tag">한식</span>

                <h3>정통 전주 비빔밥의 비밀 레시피</h3>

                <div class="writer">
                    <span>김셰프</span>
                    <span>👁 1.2K</span>
                    <span>💬 24</span>
                </div>

            </div>

        </div>

        <div class="recipe-card">

            <div class="image">
                <img src="https://picsum.photos/300/200?2">
                <span class="score">★ 4.9</span>
            </div>

            <div class="content">

                <span class="tag">양식</span>

                <h3>육즙 가득! 수제 버거 레시피</h3>

                <div class="writer">
                    <span>버거마스터</span>
                    <span>👁 850</span>
                    <span>💬 12</span>
                </div>

            </div>

        </div>

        <div class="recipe-card">

            <div class="image">
                <img src="https://picsum.photos/300/200?3">
                <span class="score">★ 4.7</span>
            </div>

            <div class="content">

                <span class="tag">일식</span>

                <h3>집에서도 만드는 오마카세 초밥</h3>

                <div class="writer">
                    <span>스시왕</span>
                    <span>👁 2.4K</span>
                    <span>💬 45</span>
                </div>

            </div>

        </div>

        <div class="recipe-card">

            <div class="image">
                <img src="https://picsum.photos/300/200?4">
                <span class="score">★ 4.6</span>
            </div>

            <div class="content">

                <span class="tag">중식</span>

                <h3>불맛 가득! 마라볶음</h3>

                <div class="writer">
                    <span>중식달인</span>
                    <span>👁 3.1K</span>
                    <span>💬 67</span>
                </div>

            </div>

        </div>

    </div>

    <div class="pagination">
        <button>&lt;</button>
        <button class="active">1</button>
        <button>2</button>
        <button>3</button>
        <button>4</button>
        <button>5</button>
        <button>&gt;</button>
    </div>

</div>

</body>
</html>
