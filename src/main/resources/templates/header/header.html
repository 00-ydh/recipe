<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<header class="site-header" th:fragment="header" style="background-color:#ffffff;">
    <link rel="stylesheet" th:href="@{/common.css}">
    <link rel="stylesheet" th:href="@{/header/header.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <div class="header-inner">
        <!-- 로고 -->
        <a th:href="@{/}" class="logo">
            <i class="fa-solid fa-utensils logo-icon"></i>
            <span>냉부</span>
        </a>
        <!-- 검색창 -->
        <form action="/recipe/posts/search" method="get" class="search-form">
            <div class="search-bar">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A08070" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" name="keyword" placeholder="레시피, 팁 검색..." th:value="${keyword}">
            </div>
            <button type="submit" class="search-btn">검색</button>
        </form>
        <!-- 메뉴 -->
        <nav class="header-nav">
            <a th:href="@{/}" class="nav-link">홈</a>
            <a th:href="@{/recipe/list}" class="nav-link">레시피</a>
            <a th:href="@{/today/list}" class="nav-link">오늘 뭐 먹지?</a>
            <a th:href="@{/tip/list}" class="nav-link">요리 꿀팁</a>
        </nav>
        <!-- 로그인 / 비로그인 상태에 따라 다른 UI 표시 -->
        <div class="header-actions">
            <!-- 로그인 상태: 프로필 이미지 클릭 시 마이페이지 이동 -->
            <th:block th:if="${session.loginMember != null}">
                <a th:href="@{/member/mypage}" class="user-avatar">
                    <img src="/header/profile.svg" alt="마이페이지" class="profile-icon">
                </a>
            </th:block>
            <!-- 비로그인 상태: 로그인 버튼 클릭 시 로그인 페이지 이동 -->
            <th:block th:if="${session.loginMember == null}">
                <a th:href="@{/member/login}" class="login-btn">로그인</a>
            </th:block>
        </div>
    </div>
</header>
</html>
