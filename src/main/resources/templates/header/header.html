<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<header class="site-header" th:fragment="header" style="background-color:#ffffff;">
    <link rel="stylesheet" th:href="@{/header/header.css}">
    <div class="header-inner">
        <!-- 로고 -->
        <a th:href="@{/}" class="logo">
            <img src="/header/logo.svg" alt="냉부 로고" class="logo-img">
        </a>
        <!-- 검색창 -->
        <div class="search-bar">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A08070" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" placeholder="레시피, 팁 검색...">
        </div>
        <!-- 메뉴 -->
        <nav class="header-nav">
            <a th:href="@{/}" class="nav-link active">홈</a>
            <a th:href="@{/recipe/list}" class="nav-link">레시피</a>
            <a th:href="@{/today/list}" class="nav-link">오늘 뭐 먹지?</a>
            <a th:href="@{/tip/list}" class="nav-link">요리 꿀팁</a>
        </nav>
        <!-- 로그인 -->
        <div class="header-actions">
            <!-- 로그인 상태: 프로필 원 (마이페이지 이동) -->
            <th:block th:if="${session.loginMember != null}">
                <a th:href="@{/member/mypage}" class="user-avatar" id="userAvatar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#58413A" stroke-width="1.8">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                    </svg>
                </a>
            </th:block>
            <th:block th:if="${session.loginMember == null}">
            <!-- 비로그인 상태: 프로필 아이콘 (로그인 페이지 이동) -->
                <a th:href="@{/member/login}" class="user-avatar" id="loginBtn">
                    <img src="/header/profile.svg" alt="로그인" class="profile-icon">
                </a>
            </th:block>
        </div>
    </div>
    <script>
        // 로그인 상태 확인 후 UI 전환
        // 실제 구현 시 서버에서 세션 정보를 받아 처리
        const isLoggedIn = false; // TODO: 서버 세션 연동 후 교체

        if (isLoggedIn) {
            document.getElementById('userAvatar').style.display = 'flex';
            document.getElementById('loginBtn').style.display = 'none';
        }
    </script>
</header>
</html>
