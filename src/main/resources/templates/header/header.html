<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냉부</title>
    <link rel="stylesheet" href="header.css">
</head>
<body>

<!-- ============================
     헤더
     로고 / 검색창 / 네비 / 유저 액션
============================= -->
<header class="site-header">
    <div class="header-inner">

        <!-- 로고 -->
        <a href="/" class="logo">
            <img src="/header/logo.svg" alt="냉부 로고" class="logo-img">
        </a>

        <!-- 검색창 -->
        <div class="search-bar">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" placeholder="레시피, 팁 검색...">
        </div>

        <!-- 네비게이션 메뉴 -->
        <nav class="header-nav">
            <a href="/" class="nav-link active">홈</a>
            <a href="/recipe/list.html" class="nav-link">레시피</a>
            <a href="/today/list.html" class="nav-link">오늘 뭐 먹지?</a>
            <a href="/tip/list.html" class="nav-link">요리 꿀팁</a>
        </nav>

        <!-- 유저 액션 -->
        <div class="header-actions">
            <!-- 로그인 상태: 프로필 원 (마이페이지 이동) -->
            <a href="/mypage" class="user-avatar" id="userAvatar" style="display:none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#58413A" stroke-width="1.8">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
            </a>
            <!-- 비로그인 상태: 프로필 아이콘 (로그인 페이지 이동) -->
            <a href="/login" class="user-avatar" id="loginBtn">
                <img src="/header/profile.svg" alt="로그인" class="profile-icon">
            </a>
        </div>

    </div>
</header>

<script>
    // 로그인 상태 확인 후 UI 전환
    // 실제 구현 시 서버에서 세션 정보를 받아 처리
    const isLoggedIn = false; // TODO: 서버 세션 연동 후 교체

    if (isLoggedIn) {
        document.getElementById('userAvatar').style.display = 'flex';
        document.getElementById('loginBtn').style.display = 'none';
    }
</script>

</body>
</html>
