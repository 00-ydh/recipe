<!-- 검색결과 페이지 -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>검색결과</title>
    <link rel="stylesheet" href="/search/search.css">
</head>

<!--header 삽입 코드 한줄 !-->
<div th:replace="~{header/header :: header}"></div>
<body>

<div class="container">

    <!-- 검색 결과 제목 ("검색어" 의 검색결과) -->
    <!-- 내가 검색한 검색어 부분 -->
    <h2 class="search-title">"<span class="search-keyword">검색어</span>" 의 검색결과</h2>
    <!-- 탭 부분-->
    <input type="radio" id="tab1" name="tab" checked>
    <input type="radio" id="tab2" name="tab">

    <!-- 탭 메뉴 버튼 (label 클릭 → 위 radio 체크됨 → CSS로 탭 전환) -->
    <div class="tab-menu">
        <label for="tab1" class="tab-item">레시피</label>
        <label for="tab2" class="tab-item">요리꿀팁</label>
    </div>


    <!-- =====================================================
         탭 1 : 레시피 탭 눌렀을 때 나오는 부분
    ====================================================== -->
    <div class="tab-content tab-content-1">
        <div class="recipe-grid">
            <!-- svg 태그는 아이콘입니다 참고해주세요!! -->
            <!-- 레시피 카드 1 -->

        <!-- 반복되어야 하는 부분 입니다!   a 태그 부분 -->
            <a href="#" class="recipe-card">
                <div class="recipe-img-wrap">
                    <!-- 레시피 대표 이미지 -->
                    <img src="https://loremflickr.com/300/200/food?lock=1" alt="레시피 이미지" class="recipe-img">
                    <!-- 이미지 위 좋아요 / 스크랩 수 뱃지 -->
                    <div class="recipe-img-stats">
                        <span>
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="1"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                            5
                        </span>
                        <span>
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                            15
                        </span>
                    </div>
                </div>
                <div class="recipe-card-body">
                    <span class="recipe-category-tag">한식</span>       <!-- 카테고리 -->
                    <p class="recipe-title">매콤 달콤 제육볶음 황금레시피</p>  <!-- 제목 -->
                    <p class="recipe-author">작성자</p>                  <!-- 작성자 -->
                    <div class="recipe-bottom">
                        <span class="recipe-views">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            1.2k  <!-- 조회수 -->
                        </span>
                        <span class="recipe-date">2024.05.15</span>     <!-- 작성일 -->
                    </div>
                </div>
            </a>

                        </span>
                        <span class="recipe-date">2024.05.15</span>

        </div>
    </div>



    <!-- =====================================================
         탭 2 : 요리꿀팁 탭 눌렀을 때 나오는 부분
    ====================================================== -->
    <div class="tab-content tab-content-2">
        <div class="tip-list">

            <!-- 꿀팁 카드 1 -->
            <!-- 반복되어야 하는 부분입니다 a 태그 부분 -->
            <a href="#" class="tip-card">
                <div class="tip-info">
                    <!-- 꿀팁 제목 -->
                    <h3>양파 눈물 없이 써는 꿀팁</h3>
                    <!-- 작성자 / 작성일 / 조회수 -->
                    <div class="meta">
                        <span>
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                            작성자
                        </span>
                        <span>
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                            2024.05.20
                        </span>
                        <span>
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            45
                        </span>
                    </div>
                </div>
                <!-- 우측 화살표 꾸밈요소 -->
                <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"/>
                </svg>
            </a>


            <!-- 꿀팁 카드 2 -->
            <a href="#" class="tip-card">
                <div class="tip-info">
                    <h3>계란 완벽하게 삶는 방법</h3>
                    <div class="meta">
                        <span>
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
