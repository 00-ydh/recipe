<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 - 냉부</title>
    <link rel="stylesheet" href="/member/css/mypage.css">
</head>
<body>

<div class="container">
    <!-- 1. 상단 프로필 카드리스트 -->
    <div class="profile-card">
        <div class="profile-left">
            <div class="user-info">
                <span class="nickname">Chef YumYum</span>
                <a href="#" class="btn-edit-profile">내정보수정 ✏️</a>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-num">42</span>
                    <span class="stat-label">게시물</span>
                </div>
                <div class="stat-item">
                    <span class="stat-num">1.2k</span>
                    <span class="stat-label">팔로워</span>
                </div>
            </div>
        </div>
        <div class="profile-right">
            <button type="button" class="btn-logout">로그아웃</button>
        </div>
    </div>

    <!-- 2. 탭 메뉴 -->
    <div class="tab-menu">
        <button type="button" class="tab-item active">내가 쓴 글</button>
        <button type="button" class="tab-item">스크랩한 레시피</button>
        <button type="button" class="tab-item">팔로우</button>
    </div>

    <!-- 3. 레시피 그리드 목록 -->
    <div class="recipe-grid">
        <!-- 카드 1 -->
        <div class="recipe-card">
            <div class="thumbnail-wrapper">
                <img src="/images/jeyuk.jpg" alt="매콤 달콤 제육볶음">
                <span class="view-badge">👁 1,240</span>
            </div>
            <div class="card-content">
                <h3 class="recipe-title">매콤 달콤 제육볶음 황금레시피</h3>
                <div class="card-footer">
                    <span class="date">2024.05.15</span>
                    <div class="actions">
                        <a href="#">수정</a>
                        <span class="divider">|</span>
                        <a href="#">삭제</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 카드 2 -->
        <div class="recipe-card">
            <div class="thumbnail-wrapper">
                <img src="/images/kimchi-stew.jpg" alt="돼지고기 김치찌개">
                <span class="view-badge">👁 856</span>
            </div>
            <div class="card-content">
                <h3 class="recipe-title">묵은지 듬뿍! 돼지고기 김치찌개</h3>
                <div class="card-footer">
                    <span class="date">2024.05.10</span>
                    <div class="actions">
                        <a href="#">수정</a>
                        <span class="divider">|</span>
                        <a href="#">삭제</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 카드 3 -->
        <div class="recipe-card">
            <div class="thumbnail-wrapper">
                <img src="/images/toast.jpg" alt="아보카도 수란 토스트">
                <span class="view-badge">👁 2,105</span>
            </div>
            <div class="card-content">
                <h3 class="recipe-title">아보카도 수란 토스트 브런치</h3>
                <div class="card-footer">
                    <span class="date">2024.05.02</span>
                    <div class="actions">
                        <a href="#">수정</a>
                        <span class="divider">|</span>
                        <a href="#">삭제</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 카드 4 -->
        <div class="recipe-card">
            <div class="thumbnail-wrapper">
                <img src="/images/gimbap.jpg" alt="김밥 만들기">
                <span class="view-badge">👁 560</span>
            </div>
            <div class="card-content">
                <h3 class="recipe-title">나들이 필수! 알록달록 김밥 만들기</h3>
                <div class="card-footer">
                    <span class="date">2024.04.25</span>
                    <div class="actions">
                        <a href="#">수정</a>
                        <span class="divider">|</span>
                        <a href="#">삭제</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
