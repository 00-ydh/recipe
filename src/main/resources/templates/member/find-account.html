<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기</title>
    <link rel="stylesheet" href="/member/css/find-account.css">
</head>
<body>

<div class="card">
    <h1 class="title">비밀번호 찾기</h1>

    <form class="find-form" th:action="@{/member/find-account}" method="POST" th:object="${member}">
        <!-- 아이디 (이메일) -->
        <div class="form-group">
            <label for="email">아이디 (이메일)</label>
            <input type="email" id="email" th:field="*{email}" placeholder="example@email.com">
        </div>

        <!-- 이름 -->
        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" th:field="*{name}" placeholder="성함을 입력해주세요">
        </div>

        <!-- 비밀번호 찾기 버튼 -->
        <button type="submit" class="btn-primary">비밀번호 찾기</button>

        <!-- 조회 결과 영역 -->
        <div class="result-box" th:if="${resultMessage}" th:text="${resultMessage}">
            조회 결과: 비밀번호는 12345 입니다.
        </div>

        <!-- 하단 링크 -->
        <div class="bottom-links">
            <a th:href="@{/member/login}">로그인으로 돌아가기</a>
            <span class="divider">|</span>
            <a th:href="@{/member/register}">회원가입</a>
        </div>
    </form>
</div>

</body>
</html>
