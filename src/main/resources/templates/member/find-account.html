<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기 - 냉부</title>
    <link rel="stylesheet" href="/member/css/find-account.css">
</head>
<body>

<div>
    <h2>비밀번호 찾기</h2>

    <!-- 비밀번호 찾기 폼 (서버로 직접 POST 전송) -->
    <form action="/member/find-password" method="POST">
        <div>
            <label for="pw-email">아이디 (이메일)</label><br>
            <input type="email" id="pw-email" name="email" placeholder="example@email.com" required>
        </div>

        <br>

        <div>
            <label for="pw-name">이름</label><br>
            <input type="text" id="pw-name" name="name" placeholder="성함을 입력해주세요" required>
        </div>

        <br>

        <button type="submit">비밀번호 찾기</button>
    </form>

    <!--
      비밀번호 결과 표시 영역
      (스프링 컨트롤러에서 result 변수/모델에 값을 담아 전송하면 여기에 출력됩니다)
    -->
    <!-- 타임리프 사용 시 예시: <div id="result-message" th:if="${result}"> -->
    <div id="result-message" style="margin-top: 20px; padding: 15px; background-color: #FAF3EF; border-radius: 8px;">
        <p><strong>조회 결과:</strong> 비밀번호는 12345 입니다.</p>
    </div>

    <br>
    <hr>

    <!-- 하단 이동 링크 -->
    <div>
        <a href="/member/login">로그인으로 돌아가기</a> | <a href="/member/signup">회원가입</a>
    </div>
</div>

</body>
</html>
