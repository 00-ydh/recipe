<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>계정 만들기 - 냉부</title>
    <link rel="stylesheet" href="/member/css/register.css">
</head>
<body>

<div>
    <h1>계정 만들기</h1>
    <p>활기찬 요리 커뮤니티의 일원이 되어보세요.</p>

    <form action="#" method="POST">
        <!-- 이메일 -->
        <div>
            <label for="email">이메일 (아이디)</label><br>
            <input type="email" id="email" name="email" placeholder="example@nengbu.com" required>
        </div>

        <br>

        <!-- 비밀번호 / 비밀번호 확인 -->
        <div>
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="최소 8자 이상" required>
            <label for="password-confirm">비밀번호 확인</label><br>
            <input type="password" id="password-confirm" name="passwordConfirm" placeholder="비밀번호 재입력" required>
        </div>

        <br>

        <!-- 별명 -->
        <div>
            <label for="nickname">별명</label><br>
            <input type="text" id="nickname" name="nickname" placeholder="어떤 이름으로 불러드릴까요?" required>
        </div>

        <br>

        <!-- 약관 동의 -->
        <div>
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">
                가입 시 귀하는 본 서비스의 <a href="#">이용약관</a> 및 <a href="#">개인정보 처리방침</a>에 동의하게 됩니다.
            </label>
        </div>

        <br>

        <!-- 가입하기 버튼 -->
        <button type="submit">가입하기</button>
    </form>

    <br>

    <!-- 하단 로그인 이동 -->
    <div>
        이미 계정이 있으신가요? <a href="#">로그인하기</a>
    </div>
</div>

</body>
</html>
