<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계정 만들기 - 냉부</title>
    <link rel="stylesheet" href="/member/css/register.css">
</head>
<body>

<div class="card">
    <h1 class="title">계정 만들기</h1>
    <p class="subtitle">활기찬 요리 커뮤니티의 일원이 되어보세요.</p>

    <form class="signup-form">
        <!-- 이메일 (아이디) -->
        <div class="form-group">
            <label for="email">이메일 (아이디)</label>
            <input type="email" id="email" placeholder="example@nengbu.com">
        </div>

        <!-- 비밀번호 -->
        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" placeholder="최소 8자 이상">
        </div>

        <!-- 비밀번호 확인 -->
        <div class="form-group">
            <label for="password-confirm">비밀번호 확인</label>
            <input type="password" id="password-confirm" placeholder="비밀번호 재입력">
        </div>

        <!-- 별명 -->
        <div class="form-group">
            <label for="nickname">별명</label>
            <input type="text" id="nickname" placeholder="어떤 이름으로 불러드릴까요?">
        </div>

        <!-- 가입하기 버튼 -->
        <button type="submit" class="btn-primary">가입하기</button>

        <!-- 하단 로그인 링크 -->
        <div class="bottom-links">
            <span>이미 계정이 있으신가요?</span>
            <a href="#">로그인하기</a>
        </div>
    </form>
</div>

</body>
</html>
