<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계정 만들기 - 냉부</title>
    <link rel="stylesheet" href="/member/css/register.css">
</head>
<body>

<div class="card">
    <h1 class="title">계정 만들기</h1>
    <p class="subtitle">활기찬 요리 커뮤니티의 일원이 되어보세요.</p>
    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red"></p>
    <form class="signup-form" th:action="@{/member/register}" method="post" th:object="${member}">
        <!-- 이메일 (아이디) -->
        <div class="form-group">
            <label for="email">이메일 (아이디)</label>
            <input type="email" id="email" th:field="*{email}" required placeholder="example@nengbu.com">
            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">에러 메시지</div>
        </div>

        <!-- 비밀번호 -->
        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" th:field="*{password}" placeholder="최소 8자 이상">
            <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">에러 메시지</div>
        </div>

        <!-- 비밀번호 확인 -->
        <div class="form-group">
            <label for="password-confirm">비밀번호 확인</label>
            <input type="password" id="password-confirm" name="passwordConfirm" placeholder="비밀번호 재입력">
        </div>

        <!-- 별명 -->
        <div class="form-group">
            <label for="name">별명</label>
            <input type="text" id="name" th:field="*{name}" placeholder="어떤 이름으로 불러드릴까요?">
            <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">에러 메시지</div>
        </div>

        <!-- 가입하기 버튼 -->
        <button type="submit" class="btn-primary">가입하기</button>

        <!-- 하단 로그인 링크 -->
        <div class="bottom-links">
            <span>이미 계정이 있으신가요?</span>
            <a th:href="@{/member/login}">로그인하기</a>
        </div>
    </form>
</div>

</body>
</html>
