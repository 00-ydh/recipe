<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원정보 수정</title>
    <!-- 아이콘 사용을 위한 Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/member/css/user-edit.css">
</head>
<body>
<!--header 삽입 코드 한줄 !-->
<div th:replace="~{header/header :: header}"></div>

<div class="card">
    <h1 class="title">회원정보 수정</h1>
    <p class="subtitle">소중한 정보를 안전하게 관리하세요.</p>

    <form class="profile-form" method="post" th:object="${member}">
        <!-- 이메일 그룹 -->
        <div class="form-group">
            <label for="email">이메일</label>
            <div class="input-row">
                <div class="input-box read-only">
                    <i class="fa-regular fa-envelope icon"></i>
                    <input type="email" id="email" th:field="*{email}" readonly>
                </div>
            </div>
        </div>

        <!-- 별명 그룹 -->
        <div class="form-group">
            <label for="nickname">별명</label>
            <div class="input-row">
                <div class="input-box">
                    <i class="fa-regular fa-user icon"></i>
                    <input type="text" id="nickname" th:field="*{name}">
                </div>
                <button type="submit" class="btn-sub" th:formaction="@{/member/edit/name}">별명 수정</button>
            </div>
            <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">에러 메시지</div>
        </div>

        <!-- 비밀번호 그룹 -->
        <div class="form-group">
            <label for="password">비밀번호</label>
            <div class="input-row">
                <div class="input-box">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" id="password" th:field="*{password}">
                </div>
                <button type="submit" class="btn-sub" th:formaction="@{/member/edit/password}" onclick="return confirm('정말로 변경하시겠습니까?');">비밀번호 수정</button>
            </div>
            <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">에러 메시지</div>
        </div>

        <!-- 하단 탈퇴하기 버튼 -->
        <button type="submit" class="btn-danger" th:formaction="@{/member/delete}" onclick="return confirm('정말로 탈퇴하시겠습니까?');">탈퇴하기</button>
    </form>
</div>

</body>
</html>
