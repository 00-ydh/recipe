<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 - 냉부</title>
    <link rel="stylesheet" href="/member/css/login.css">
</head>
<body>

<div>
    <!-- 상단 로고 및 문구 -->
    <div>
        <h1>🍴 냉부</h1>
        <p>나만의 냉장고 레시피,<br>다시 요리하는 즐거움을 찾아보세요.</p>
    </div>

    <!-- 로그인 폼 영역 -->
    <div>
        <h2>로그인</h2>

        <form action="#" method="POST">
            <!-- 아이디 (이메일) -->
            <div>
                <label for="email">아이디 (이메일)</label><br>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>

            <br>

            <!-- 비밀번호 -->
            <div>
                <label for="password">비밀번호</label><br>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
            </div>

            <br>

            <!-- 버튼 영역 -->
            <div>
                <button type="submit">로그인</button>
                <a href="#">회원가입</a>
            </div>
        </form>

        <hr>

        <!-- 아이디 / 비밀번호 찾기 -->
        <div>
            <a href="#">아이디 / 비밀번호 찾기</a>
        </div>
    </div>

    <!-- 하단 카피라이트 -->
    <footer>
        <p>&copy; 2024 냉부(NaengBu) Community. All rights reserved.</p>
    </footer>
</div>

</body>
</html>
