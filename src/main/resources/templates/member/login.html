<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 냉부</title>
    <!-- 아이콘 사용을 위한 Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/member/css/login.css">
</head>
<body>

<div class="login-container">
    <!-- 상단 로고 및 서비스 소개 -->
    <div class="logo-area">
        <div class="logo">
            <i class="fa-solid fa-utensils logo-icon"></i>
            <span>냉부</span>
        </div>
        <p class="service-desc">나만의 냉장고 레시피,다시 요리하는 즐거움을 찾아보세요.</p>
    </div>

    <!-- 로그인 카드 -->
    <div class="card">
        <h1 class="title">로그인</h1>
        <p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red"></p>
        <form class="login-form" th:action="@{/member/login}" method="post">
            <!-- 아이디 (이메일) -->
            <div class="form-group">
                <label for="email">아이디 (이메일)</label>
                <input type="email" id="email" name="email" placeholder="example@email.com">
            </div>

            <!-- 비밀번호 -->
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요">
            </div>

            <!-- 로그인 / 회원가입 버튼 영역 -->
            <div class="btn-group">
                <button type="submit" class="btn-primary">로그인</button>
                <a th:href="@{/member/register}" class="btn-secondary">회원가입</a>
            </div>

            <!-- 아이디 / 비밀번호 찾기 -->
            <div class="bottom-links">
                <a th:href="@{/member/find-account}">아이디 / 비밀번호 찾기</a>
            </div>
        </form>
    </div>

    <!-- 하단 카피라이트 -->
    <footer class="footer">
        © 2024 냉부(NaengBu) Community. All rights reserved.
    </footer>
</div>

</body>
</html>
