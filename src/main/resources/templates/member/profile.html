<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필</title>
    <link rel="stylesheet" href="/main-style.css">
    <link rel="stylesheet" href="/member/css/profile-style.css">
</head>
<body>
<!--header 공통 파일 header 들어가는 부분에 이 두줄 코드 넣을 것!-->
<div id="header-placeholder"></div>
<script src="/header/load-header.js"></script>
<!--header 끝-->

<main class="mypage-wrap">

    <!-- ============================
         프로필 섹션
    ============================= -->
    <section class="profile-section">
        <div class="container">
            <div class="profile-inner">

                <!-- 프로필 아바타 -->
                <div class="profile-avatar">
                    <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#58413A" stroke-width="1.5">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                    </svg>
                </div>

                <!-- 프로필 정보 -->
                <div class="profile-info">
                    <h1 class="profile-name" th:text="${member.name}">키친마스터_정</h1>
                    <div class="profile-stats">
                        <div class="stat-item">
                            <span class="stat-value">1,240</span>
                            <span class="stat-label">등록레시피</span>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="stat-item">
                            <span class="stat-value">12</span>
                            <span class="stat-label">공유한 레시피</span>
                        </div>
                    </div>
                </div>

                <!-- 팔로우 버튼 -->
                <button class="follow-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="8.5" cy="7" r="4"/>
                        <line x1="20" y1="8" x2="20" y2="14"/>
                        <line x1="23" y1="11" x2="17" y2="11"/>
                    </svg>
                    팔로우
                </button>

            </div>
        </div>
    </section>

    <!-- ============================
         작성한 레시피 목록
    ============================= -->
    <section class="mypage-recipes">
        <div class="container">

            <div class="mypage-section-header">
                <h2 class="mypage-section-title">작성한 레시피 목록</h2>
                <p class="mypage-section-sub">작성한 레시피 목록을 볼 수 있어요!</p>
            </div>

            <div class="recipe-grid mypage-grid">
                <article class="recipe-card" th:each="recipe : ${myRecipes}">
                    <a th:href="@{/recipe/detail(id=${recipe.id})}">
                    <div class="recipe-img-wrap">
                        <img class="recipe-img" src="https://loremflickr.com/300/200/food?lock=21" alt="레시피 이미지">
                        <div class="recipe-img-stats">
                            <span><svg width="12" height="12" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="1"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> 5</span>
                            <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> 15</span>
                        </div>
                    </div>
                    <div class="recipe-card-body">
                        <span class="recipe-category-tag" th:text="${recipe.categoryName}">한식</span>
                        <p class="recipe-title" th:text="${recipe.title}">매콤 달콤 제육볶음 황금레시피</p>
                        <p class="recipe-author" th:text="${member.name}">작성자.........</p>
                        <div class="recipe-bottom">
                            <span class="recipe-views"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> 1.2k</span>
                            <span class="recipe-cmt"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> 45</span>
                            <span class="recipe-date">2024.05.15</span>
                        </div>
                    </div>
                    </a>
                </article>
            </div>

        </div>
    </section>

</main>

</body>
</html>
